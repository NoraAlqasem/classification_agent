[project]
name = "resnet-training-agent"
version = "0.2.0"
description = "Autonomous multi-head ResNet classification training with PyTorch DDP and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<2",
    "langchain-openai>=0.2,<2",
    "langchain-core>=0.3,<2",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "numpy>=1.24,<3",
    "pandas>=2,<4",
    "pillow>=10",
    "matplotlib>=3.7,<4",
    "onnx>=1.15,<2",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "rich>=13,<16",
    "typing-extensions>=4.7,<5",
]

[project.optional-dependencies]
verify = ["onnxruntime>=1.16,<2"]
